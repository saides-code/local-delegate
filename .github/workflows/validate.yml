name: validate

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not incidental: the encoding guard, the launcher discovery and
        # the command-line limits all exist because of failures seen only there.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scripts compile, standard library only
        run: python -m compileall -q skills/local-delegate/scripts

      - name: Manifests, frontmatter and referenced paths
        run: python .github/scripts/validate_plugin.py

      # The suite lives on develop: it needs a fake Ollama and a fake launcher, which
      # are scaffolding rather than part of the skill anyone installs. Conditional so
      # one workflow file serves both branches.
      - name: Tests
        if: hashFiles('tests/**') != ''
        run: python -m unittest discover -s tests -v
